# ============================================================================
# intern-watch config
#
# Each entry = one company you're monitoring.
#
# adapter options:
#   greenhouse  -> params: { slug: "companyname" }
#   ashby       -> params: { board: "boardname" }
#   workday     -> params: { tenant: "companyname", site: "SiteName", wd: "wd1" }
#                  (the wd number varies per company -- wd1, wd5, wd12, etc -- check DevTools.
#                  search_text defaults to "intern" but has proven unreliable at some
#                  companies -- see DraftKings below, which sets it blank on purpose.
#                  max_pages defaults to 10 (200 postings); raise it if a company's
#                  catalog is bigger and you're missing postings.)
#   radancy     -> params: { url: "...", base_url: "https://companycareers.com" }
#                  (url is the full captured "?ActiveFacetID=Internship&..." request --
#                  a Radancy-platform career search filtered to internships.)
#   generic_json-> params: { url: "...", method: "GET" (default) or "POST", body: {...} (for POST),
#                             jobs_path: "jobs", id_field: "id",
#                             title_field: "title", url_field: "url",
#                             location_field: "location" (optional) }
#
# keywords: job title must contain at least one of these (case-insensitive,
#           matches "intern"/"interns"/"internship"/"internships" as one word,
#           but never matches inside "International" or "Internals")
# exclude:  job title must NOT contain any of these
# us_only:  if true, rejects postings whose location clearly names a non-US
#           country/city (a blocklist, not an allowlist) -- blank/unknown
#           locations are always kept rather than risk dropping a real US role.
# ============================================================================

- name: "Duolingo"
  adapter: greenhouse
  params:
    slug: "duolingo"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Databricks"
  adapter: greenhouse
  params:
    slug: "databricks"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Stripe"
  adapter: greenhouse
  params:
    slug: "stripe"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Coinbase"
  adapter: greenhouse
  params:
    slug: "coinbase"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Robinhood"
  adapter: greenhouse
  params:
    slug: "robinhood"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Snowflake"
  adapter: ashby
  params:
    board: "snowflake"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "DraftKings"
  adapter: workday
  params:
    tenant: "draftkings"
    site: "DraftKings"
    wd: "wd1"
    search_text: ""    # blank on purpose -- their ~85 total postings fit comfortably
                        # under our page cap, so we pull everything and let our own
                        # keyword filter do the work, rather than trust Workday's
                        # fuzzy relevance search to surface interns
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Capital One"
  adapter: radancy
  params:
    url: "https://www.capitalonecareers.com/search-jobs/results?ActiveFacetID=Internship&CurrentPage=1&RecordsPerPage=50&TotalContentResults=&Distance=50&RadiusUnitType=0&Keywords=intern&Location=&ShowRadius=False&IsPagination=False&CustomFacetName=&FacetTerm=&FacetType=0&FacetFilters%5B0%5D.ID=Internship&FacetFilters%5B0%5D.FacetType=5&FacetFilters%5B0%5D.Count=2&FacetFilters%5B0%5D.Display=Internship&FacetFilters%5B0%5D.IsApplied=true&FacetFilters%5B0%5D.FieldName=industry&SearchResultsModuleName=Search+Results&SearchFiltersModuleName=Search+Filters&SortCriteria=0&SortDirection=0&SearchType=1&PostalCode=&ResultsType=0&fc=&fl=&fcf=&afc=&afl=&afcf=&TotalContentPages=NaN"
    base_url: "https://www.capitalonecareers.com"
  keywords: ["intern", "tip"]
  exclude: []
  us_only: true

- name: "Amazon"
  adapter: generic_json
  params:
    url: "https://www.amazon.jobs/en/search.json?base_query=software+development+engineer+intern&normalized_country_code%5B%5D=USA&result_limit=20&sort=recent"
    jobs_path: "jobs"
    id_field: "id_icims"
    title_field: "title"
    url_field: "job_path"
    url_prefix: "https://www.amazon.jobs"
    location_field: "normalized_location"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Microsoft"
  adapter: generic_json
  params:
    url: "https://apply.careers.microsoft.com/api/pcsx/search?domain=microsoft.com&query=intern&location=&start=0&num=20"
    jobs_path: "data.positions"
    id_field: "id"
    title_field: "name"
    url_field: "id"
    url_prefix: "https://apply.careers.microsoft.com/careers?pid="
    location_field: "location"
  keywords: ["intern", "explore"]
  exclude: []
  us_only: true

- name: "PayPal"
  adapter: workday
  params:
    tenant: "paypal"
    site: "jobs"
    wd: "wd1"
    search_text: ""    # blank on purpose -- same fix as DraftKings, server-side "intern" search proved unreliable
    max_pages: 20        # ~66 was suspiciously low for a company PayPal's size; give it room
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "PNC"
  adapter: generic_json
  params:
    # [confirmed via DevTools] PNC's public search runs through Phenom People
    # (careers.pnc.com/widgets), a layer in front of their real Workday
    # backend -- similar to how Capital One's Radancy sits in front of theirs.
    # POST body captured from their actual "intern" search; returns clean JSON,
    # no HTML-fragment parsing needed. applyUrl already points to the real
    # Workday posting.
    url: "https://careers.pnc.com/widgets"
    method: "POST"
    body:
      lang: "en_global"
      deviceType: "desktop"
      country: "global"
      pageName: "search-results"
      all_fields: ["country", "city", "state", "category", "type", "remote", "phLocSlider"]
      clearAll: false
      counts: true
      ddoKey: "eagerLoadRefineSearch"
      from: 0
      global: true
      irs: false
      isSliderEnable: true
      jdsource: "facets"
      jobs: true
      keywords: ""
      location: ""
      pageId: "page13-ds"
      s: "1"
      selected_fields: {}
      siteType: "external"
      size: 50
      sortBy: ""
      subsearch: "intern"
    jobs_path: "eagerLoadRefineSearch.data.jobs"
    id_field: "reqId"
    title_field: "title"
    url_field: "applyUrl"
    location_field: "state"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "BNY"
  adapter: oracle_cloud
  params:
    # [confirmed via DevTools] site_number=CX_3001, locationId=300000000378743
    # (US) are both real. The 500 wasn't a bug -- BNY genuinely has that many
    # postings matching keyword="intern" broadly (not title-only) without a
    # date filter. posting_days=7 is the real chokepoint: a genuine server-side
    # filter that also happens to be exactly what we want, since we only care
    # about postings new enough to matter.
    host: "eofe.fa.us2.oraclecloud.com"
    site_number: "CX_3001"
    keyword: "intern"
    location_id: "300000000378743"
    posting_days: 7
    max_pages: 5
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Dell"
  adapter: oracle_cloud
  params:
    # [confirmed via DevTools] Dell runs Oracle Cloud HCM, NOT Radancy as
    # originally guessed from jobs.dell.com's URL structure -- that was two
    # wrong guesses before finding this. SiteNumber confirmed directly in a
    # real response body. TotalJobsCount was 44 for keyword=intern + this
    # location filter, comfortably within one page (page_size=100).
    host: "iawmqy.fa.ocs.oraclecloud.com"
    site_number: "CX_1001"
    keyword: "intern"
    location_id: "300000000471434"   # from a real captured request; assumed to mean United States, not independently confirmed
    max_pages: 3
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Visa"
  adapter: workday
  params:
    # [confirmed via DevTools] Visa runs a SEPARATE dedicated early-careers
    # Workday site, not their general career site -- that's why the earlier
    # SmartRecruiters guess (wrong platform entirely) only found 2 results.
    # search_text blank on purpose, same lesson as DraftKings/PayPal/PNC:
    # this site is small enough to pull in full and let our own title filter work.
    tenant: "visa"
    site: "Visa_Early_Careers"
    wd: "wd5"
    search_text: ""
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "American Express"
  adapter: oracle_cloud
  params:
    # [confirmed via DevTools] AmEx is on Oracle Cloud HCM, NOT Eightfold as
    # originally guessed. TotalJobsCount was 90 for keyword="intern" + this
    # location filter (US, confirmed via PrimaryLocationCountry in the real
    # response) -- comfortably covered by a few pages.
    host: "egug.fa.us2.oraclecloud.com"
    site_number: "CX_1"
    keyword: "intern"
    location_id: "300000000229164"   # confirmed = US via PrimaryLocationCountry in response
    max_pages: 3
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Block"
  adapter: block_svelte
  params:
    # [confirmed via View Source] Block/Square/Cash App run SvelteKit. The
    # employeeTypes[]=Intern filter here is a real, checkbox-driven server-side
    # filter -- unlike the fuzzy "keyword=intern" searches elsewhere, every
    # result returned here is guaranteed to genuinely be an internship.
    url: "https://block.xyz/careers/jobs?businessUnits%5B%5D=square&businessUnits%5B%5D=block&businessUnits%5B%5D=cashapp&employeeTypes%5B%5D=Intern"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Mastercard"
  adapter: generic_json
  params:
    # [confirmed via DevTools] Same Phenom People platform as PNC, same schema
    # -- assuming title/applyUrl field names carry over since everything else
    # matched exactly (ml_skills, descriptionTeaser, reqId, multi_location,
    # etc. all identical structure to PNC's real response).
    url: "https://careers.mastercard.com/widgets"
    method: "POST"
    body:
      lang: "en_us"
      deviceType: "desktop"
      country: "us"
      pageName: "search-results"
      all_fields: ["category", "country", "state", "city", "postalCode", "jobType", "phLocSlider"]
      clearAll: false
      counts: true
      ddoKey: "eagerLoadRefineSearch"
      from: 0
      global: true
      isSliderEnable: true
      jdsource: "facets"
      jobs: true
      keywords: ""
      location: ""
      locationData: {sliderRadius: 300, aboveMaxRadius: false, LocationUnit: "kilometers"}
      pageId: "page11"
      s: "1"
      selected_fields: {country: ["United States of America"]}
      siteType: "external"
      size: 50
      sortBy: ""
      subsearch: "intern"
    jobs_path: "eagerLoadRefineSearch.data.jobs"
    id_field: "reqId"
    title_field: "title"
    url_field: "applyUrl"
    location_field: "state"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "JPMorganChase"
  adapter: oracle_cloud
  params:
    # [confirmed via DevTools] locationId=300000000289738 assumed = US (the
    # returned sample job had PrimaryLocationCountry: "US"). Deliberately NOT
    # including the categoriesFacet seen in the captured request -- that job
    # was a senior engineering role, not an intern posting, meaning
    # keyword="intern" isn't real title-filtering here either (same lesson as
    # everywhere else), and the category facet looked incidental (whatever was
    # being browsed) rather than an "Internships" category. Our own title
    # regex does the real filtering instead.
    host: "jpmc.fa.oraclecloud.com"
    site_number: "CX_1001"
    keyword: "intern"
    location_id: "300000000289738"
    posting_days: 30
    max_pages: 3
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Google"
  adapter: google_html
  params:
    url: "https://www.google.com/about/careers/applications/jobs/results?q=intern&sort_by=date"   # VERIFY -- still my guess, swap in your real search URL
  keywords: ["intern"]
  exclude: []
  us_only: true
