# Fidelity uses Workday's OTHER hosting pattern (myworkdaysite.com), hence host_style.
# Note: "fmr" is Fidelity Investments (US). Don't confuse with "fil" = Fidelity
# International, a separate company with its own board.
- name: "Fidelity"
  adapter: workday
  params:
    tenant: "fmr"
    site: "FidelityCareers"
    wd: "wd1"
    host_style: "site"
    search_text: "intern"
  keywords: ["intern"]
  exclude: []
  us_only: true

