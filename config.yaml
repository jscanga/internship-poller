# ============================================================================
# intern-watch config
#
# Each entry = one company you're monitoring.
#
# adapter options:
#   greenhouse  -> params: { slug: "companyname" }
#   lever       -> params: { slug: "companyname" }
#   workday     -> params: { tenant: "companyname", site: "SiteName", wd: "wd1" }
#                  (the wd number varies per company -- wd1, wd5, wd12, etc -- check DevTools)
#   ashby       -> params: { board: "boardname" }
#   radancy     -> params: { url: "...", base_url: "https://companycareers.com" }
#                  (url is the full captured "?ActiveFacetID=Internship&..." request --
#                  a Radancy-platform career search filtered to internships. Job links
#                  in the response are relative, so base_url is prepended to make them clickable.)
#   generic_json-> params: { url: "...", jobs_path: "jobs", id_field: "id",
#                             title_field: "title", url_field: "url" }
#
# keywords: job title must contain at least one of these (case-insensitive)
# exclude:  job title must NOT contain any of these
# us_only:  if true, rejects postings whose location clearly names a non-US
#           country/city (a blocklist, not an allowlist) -- blank/unknown
#           locations are always kept rather than risk dropping a real US role.
#           Default is false (no location filtering) if omitted.
#
# VERIFY = I'm not certain this slug/tenant is correct. See README for how
# to confirm it in under 5 minutes before you trust that company's alerts.
# ============================================================================

- name: "Duolingo"
  adapter: greenhouse
  params:
    slug: "duolingo"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "DraftKings"
  adapter: workday
  params:
    tenant: "draftkings"
    site: "DraftKings"
    wd: "wd1"
    search_text: ""              # blank on purpose -- their ~80 total postings fit
                                  # comfortably under our page cap, so we pull everything
                                  # and let our own keyword filter do the work, rather than
                                  # trust Workday's fuzzy relevance search to surface interns
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Databricks"
  adapter: greenhouse
  params:
    slug: "databricks"          # confirmed working
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Snowflake"
  adapter: ashby
  params:
    board: "snowflake"
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Capital One"
  adapter: radancy
  params:
    url: "https://www.capitalonecareers.com/search-jobs/results?ActiveFacetID=Internship&CurrentPage=1&RecordsPerPage=50&TotalContentResults=&Distance=50&RadiusUnitType=0&Keywords=intern&Location=&ShowRadius=False&IsPagination=False&CustomFacetName=&FacetTerm=&FacetType=0&FacetFilters%5B0%5D.ID=Internship&FacetFilters%5B0%5D.FacetType=5&FacetFilters%5B0%5D.Count=2&FacetFilters%5B0%5D.Display=Internship&FacetFilters%5B0%5D.IsApplied=true&FacetFilters%5B0%5D.FieldName=industry&SearchResultsModuleName=Search+Results&SearchFiltersModuleName=Search+Filters&SortCriteria=0&SortDirection=0&SearchType=1&PostalCode=&ResultsType=0&fc=&fl=&fcf=&afc=&afl=&afcf=&TotalContentPages=NaN"
    base_url: "https://www.capitalonecareers.com"
  keywords: ["intern", "tip"]
  exclude: []
  us_only: true

- name: "Walmart"
  adapter: workday
  params:
    tenant: "walmart"
    site: "WalmartExternal"
    wd: "wd5"                   # confirmed
    search_text: "intern"
  keywords: ["intern"]
  exclude: []
  us_only: true

# The big three (Amazon/Microsoft/Google) and IBM run their own bespoke
# career search backends rather than a standard ATS. generic_json works,
# but you MUST inspect the real request shape yourself (see README "Big Tech"
# section) -- these params are placeholders, not verified endpoints.

- name: "Amazon"
  adapter: generic_json
  params:
    url: "https://www.amazon.jobs/en/search.json?base_query=software+development+engineer+intern&normalized_country_code%5B%5D=USA&result_limit=20&sort=recent"
    jobs_path: "jobs"
    id_field: "id_icims"
    title_field: "title"
    url_field: "job_path"
    url_prefix: "https://www.amazon.jobs"
    location_field: "normalized_location"   # VERIFY -- best guess, check a raw response if us_only seems to over/under-filter
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "Microsoft"
  adapter: generic_json
  params:
    url: "https://apply.careers.microsoft.com/api/pcsx/search?domain=microsoft.com&query=intern&location=&start=0&num=20"
    jobs_path: "data.positions"   # VERIFY -- Eightfold's PCSX API nests under "data", but field
    id_field: "id"                 # names can vary slightly per deployment. If this comes back
    title_field: "name"            # empty, open the search XHR in DevTools -> Response tab and
    url_field: "id"                # check the actual key names, then tell me what they are.
    url_prefix: "https://apply.careers.microsoft.com/careers?pid="
    location_field: "location"    # VERIFY -- best guess, same caveat as jobs_path/title_field above
  keywords: ["intern", "explore"]
  exclude: []
  us_only: true

- name: "Google"
  adapter: google_html
  params:
    url: "https://www.google.com/about/careers/applications/jobs/results?q=intern&sort_by=date"  # VERIFY -- paste your actual search URL here if this 404s or returns nothing
  keywords: ["intern"]
  exclude: []
  us_only: true

- name: "IBM"
  adapter: generic_json
  params:
    url: "https://www.ibm.com/careers/api/search?field_keyword=intern"    # VERIFY - placeholder
    jobs_path: "jobs"
    id_field: "id"
    title_field: "title"
    url_field: "url"
    url_prefix: ""
  keywords: ["intern"]
  exclude: []
  us_only: true

